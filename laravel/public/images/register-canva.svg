<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%" fill="none">
  <!-- Clean Flat Background -->
  <rect x="0" y="0" width="540" height="400" rx="24" fill="#F8FAFC" />
  
  <!-- Flat Decorative Shapes -->
  <circle cx="270" cy="200" r="160" fill="#EFF6FF" />
  <circle cx="100" cy="90" r="45" fill="#EEF2F6" />
  <circle cx="450" cy="100" r="50" fill="#E0F2FE" />
  
  <!-- Flat Road & Floor Base -->
  <path d="M 40 370 Q 270 340 500 370 L 500 400 L 40 400 Z" fill="#E2E8F0" />
  <path d="M 30 380 Q 270 360 510 380 L 510 400 L 30 400 Z" fill="#CBD5E1" />

  <!-- Car in Background (Flat Solid Blue) -->
  <g transform="translate(230, 150)">
    <!-- Car Body -->
    <path d="M 30 110 Q 50 55 105 45 L 185 45 Q 230 70 260 110 L 270 145 L 15 145 Z" fill="#2563EB" />
    <path d="M 60 102 L 105 56 L 140 56 L 140 102 Z" fill="#DBEAFE" />
    <path d="M 150 102 L 150 56 L 180 56 L 215 102 Z" fill="#DBEAFE" />
    <!-- Wheels -->
    <circle cx="70" cy="145" r="26" fill="#1E293B" />
    <circle cx="70" cy="145" r="12" fill="#94A3B8" />
    <circle cx="215" cy="145" r="26" fill="#1E293B" />
    <circle cx="215" cy="145" r="12" fill="#94A3B8" />
    <!-- Headlight beam -->
    <polygon points="10,120 22,116 22,132 10,128" fill="#FDE047" />
  </g>

  <!-- Friendly Standing Driver Character (Flat Canva Style) -->
  <g transform="translate(110, 80)">
    <!-- Trousers / Legs -->
    <rect x="72" y="210" width="16" height="90" rx="8" fill="#1E293B" />
    <rect x="98" y="210" width="16" height="90" rx="8" fill="#1E293B" />
    <!-- Shoes -->
    <ellipse cx="76" cy="302" rx="13" ry="6" fill="#0F172A" />
    <ellipse cx="110" cy="302" rx="13" ry="6" fill="#0F172A" />

    <!-- Jacket / Shirt -->
    <rect x="64" y="125" width="58" height="92" rx="14" fill="#2563EB" />
    <!-- Collar & Tie -->
    <polygon points="80,125 93,142 106,125" fill="#FFFFFF" />
    <polygon points="90,142 96,142 94,168 92,168" fill="#1D4ED8" />

    <!-- Left Arm holding Car Keys -->
    <path d="M 64 135 Q 40 165 52 192" stroke="#2563EB" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="52" cy="194" r="8" fill="#FED7AA" />
    <!-- Key Ring -->
    <circle cx="52" cy="206" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.8" />
    <path d="M 52 210 L 52 220 M 52 215 L 56 215" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />

    <!-- Right Arm holding Checklist Clipboard -->
    <path d="M 120 135 Q 142 162 132 188" stroke="#2563EB" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="132" cy="190" r="8" fill="#FED7AA" />
    <!-- Clipboard -->
    <rect x="124" y="172" width="34" height="44" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" transform="rotate(8 124 172)" />
    <line x1="133" y1="185" x2="149" y2="187" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
    <line x1="132" y1="194" x2="147" y2="196" stroke="#16A34A" stroke-width="2" stroke-linecap="round" />
    <line x1="131" y1="203" x2="145" y2="205" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

    <!-- Head & Face -->
    <ellipse cx="93" cy="90" rx="27" ry="29" fill="#FED7AA" />
    <!-- Hair -->
    <path d="M 65 88 C 65 60 84 55 100 57 C 117 55 125 66 123 83 C 116 72 106 70 92 72 C 79 74 72 79 65 88 Z" fill="#1E293B" />
    <!-- Eyes -->
    <circle cx="85" cy="90" r="2.8" fill="#0F172A" />
    <circle cx="103" cy="90" r="2.8" fill="#0F172A" />
    <circle cx="86" cy="89" r="0.9" fill="#FFFFFF" />
    <circle cx="104" cy="89" r="0.9" fill="#FFFFFF" />
    <!-- Cheerful Blushes -->
    <ellipse cx="80" cy="96" rx="3" ry="1.8" fill="#FCA5A5" />
    <ellipse cx="108" cy="96" rx="3" ry="1.8" fill="#FCA5A5" />
    <!-- Smile -->
    <path d="M 89 101 Q 94 107 99 101" stroke="#C2410C" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- ========================================================
       FLOATING FLAT BADGES
       ======================================================== -->
  <!-- Badge 1: Verifikasi Akun Cepat (Top Right) -->
  <g transform="translate(360, 65)">
    <rect x="0" y="0" width="150" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="23" cy="23" r="13" fill="#DCFCE7" />
    <path d="M 18 23 L 21 26 L 28 19" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Akun Pengemudi</text>
    <text x="44" y="33" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#16A34A">Aktivasi Instan</text>
  </g>

  <!-- Badge 2: Skor Keselamatan (Bottom Right) -->
  <g transform="translate(350, 270)">
    <rect x="0" y="0" width="165" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="23" cy="23" r="13" fill="#FEF3C7" />
    <!-- Star Icon -->
    <polygon points="23,16 25,21 30,21 26,24 28,29 23,26 18,29 20,24 16,21 21,21" fill="#F59E0B" />
    <text x="44" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Skor Keselamatan</text>
    <text x="44" y="33" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#64748B">Rekapitulasi Pribadi</text>
  </g>

  <!-- Canva Sparkles -->
  <g fill="#F59E0B">
    <path d="M 80 50 L 82 55 L 87 57 L 82 59 L 80 64 L 78 59 L 73 57 L 78 55 Z" />
    <path d="M 480 45 L 482 50 L 487 52 L 482 54 L 480 59 L 478 54 L 473 52 L 478 50 Z" />
    <path d="M 60 250 L 61 254 L 65 255 L 61 256 L 60 260 L 59 256 L 55 255 L 59 254 Z" fill="#3B82F6" />
    <circle cx="490" cy="200" r="3" fill="#3B82F6" />
  </g>
</svg>