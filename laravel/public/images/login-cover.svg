<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="100%" height="100%" fill="none">
  <defs>
    <!-- Smooth Atmospheric Sky & Horizon -->
    <linearGradient id="skyAtmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="45%" stop-color="#4338CA" />
      <stop offset="75%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Warm Horizon Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0" />
    </radialGradient>

    <!-- Car Interior Deep Charcoal -->
    <linearGradient id="dashShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="windshieldGlare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas (No White Borders) -->
  <rect width="440" height="560" fill="url(#skyAtmosphere)" />
  <rect width="440" height="560" fill="url(#sunGlow)" />

  <!-- Distant Mountains & Horizon -->
  <path d="M 0 310 Q 120 270 240 295 T 440 275 L 440 400 L 0 400 Z" fill="#312E81" opacity="0.6" />
  <path d="M 0 330 Q 180 295 320 320 T 440 305 L 440 420 L 0 420 Z" fill="#1E1B4B" opacity="0.8" />

  <!-- Road Ahead Leading to Horizon -->
  <polygon points="180,310 260,310 390,440 50,440" fill="#334155" />
  <line x1="220" y1="315" x2="220" y2="440" stroke="#FBBF24" stroke-width="4" stroke-dasharray="14 10" />

  <!-- Car Windshield Pillars (A-Pillars) -->
  <path d="M 0 0 L 60 320 L 0 560 Z" fill="#0F172A" />
  <path d="M 440 0 L 380 320 L 440 560 Z" fill="#0F172A" />
  <rect x="0" y="0" width="440" height="38" fill="#090D16" />

  <!-- Rearview Mirror with Green Safe Indicator -->
  <g transform="translate(185, 34)">
    <rect x="0" y="0" width="70" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="14" cy="11" r="3.5" fill="#10B981" />
    <text x="24" y="14" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#F8FAFC">AI ACTIVE</text>
    <line x1="35" y1="0" x2="35" y2="-12" stroke="#475569" stroke-width="2.5" />
  </g>

  <!-- Driver Character (Calm, Focused, Alert, Lifestyle Style) -->
  <g transform="translate(130, 160)">
    <!-- Head & Hair -->
    <ellipse cx="90" cy="75" rx="32" ry="35" fill="#FED7AA" />
    <!-- Hair Modern Dark Slate -->
    <path d="M 55 72 C 55 35 80 30 102 32 C 122 30 132 44 128 66 C 118 52 108 50 90 52 C 75 54 65 60 55 72 Z" fill="#1E293B" />
    <!-- Face: Calm, Attentive Driver Eyes -->
    <ellipse cx="80" cy="74" rx="3.5" ry="3" fill="#0F172A" />
    <ellipse cx="102" cy="74" rx="3.5" ry="3" fill="#0F172A" />
    <circle cx="81" cy="73" r="1" fill="#FFFFFF" />
    <circle cx="103" cy="73" r="1" fill="#FFFFFF" />
    <path d="M 74 67 Q 80 64 86 67" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 96 67 Q 102 64 108 67" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Friendly Confident Smile -->
    <path d="M 85 88 Q 91 94 97 88" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="74" cy="82" r="3" fill="#FCA5A5" opacity="0.5" />
    <circle cx="108" cy="82" r="3" fill="#FCA5A5" opacity="0.5" />

    <!-- Neck & Jacket -->
    <rect x="81" y="108" width="18" height="15" fill="#FDBA74" />
    <!-- Navy Driver Jacket -->
    <path d="M 42 135 L 75 118 L 105 118 L 138 135 L 152 240 L 28 240 Z" fill="#1D4ED8" />
    <polygon points="75,118 90,140 105,118" fill="#FFFFFF" />
    <line x1="90" y1="140" x2="90" y2="220" stroke="#1E40AF" stroke-width="2" />

    <!-- Driver Hands Holding Leather Steering Wheel -->
    <ellipse cx="44" cy="168" rx="10" ry="12" fill="#FED7AA" />
    <ellipse cx="136" cy="168" rx="10" ry="12" fill="#FED7AA" />
  </g>

  <!-- Car Dashboard & Steering Wheel -->
  <path d="M 0 350 Q 220 310 440 350 L 440 560 L 0 560 Z" fill="url(#dashShade)" />

  <!-- Steering Wheel Arc -->
  <g transform="translate(130, 275)">
    <circle cx="90" cy="50" r="65" fill="none" stroke="#334155" stroke-width="12" />
    <circle cx="90" cy="50" r="65" fill="none" stroke="#1E293B" stroke-width="5" />
    <!-- Center Hub -->
    <circle cx="90" cy="50" r="20" fill="#1E293B" stroke="#475569" stroke-width="2.5" />
    <circle cx="90" cy="50" r="8" fill="#2563EB" />
    <!-- Spokes -->
    <line x1="32" y1="50" x2="70" y2="50" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <line x1="110" y1="50" x2="148" y2="50" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <line x1="90" y1="70" x2="90" y2="108" stroke="#334155" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Clean Bottom Dashboard Floor (No Text, Leaves Room for HTML Overlay) -->
  <rect x="0" y="440" width="440" height="120" fill="#0A0F1D" />

  <!-- Windshield Reflection Sheen -->
  <polygon points="0,0 240,0 100,350 0,350" fill="url(#windshieldGlare)" />
</svg>
