{% extends 'base.html' %}
{% block title %}Daftar Akun Driver - Driver Monitoring System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-6">
        <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-500/20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-white">Daftar Akun Driver</h2>
        <p class="text-sm text-slate-400 mt-1">Buat akun untuk mulai menggunakan monitoring kamera</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nama Lengkap *</label>
            <input type="text" name="full_name" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition placeholder-slate-500"
                   placeholder="Contoh: Apri Catur">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">NIM / NIK (Opsional)</label>
            <input type="text" name="nim_nik"
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition placeholder-slate-500"
                   placeholder="Contoh: 3312501067">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username *</label>
            <input type="text" name="username" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition placeholder-slate-500"
                   placeholder="Pilih username unik">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password *</label>
            <input type="password" name="password" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition placeholder-slate-500"
                   placeholder="Minimal 6 karakter">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Ulangi Password *</label>
            <input type="password" name="confirm_password" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition placeholder-slate-500"
                   placeholder="Ketik ulang password">
        </div>

        <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition duration-150">
            Daftar Sekarang
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-700/60 text-center text-sm text-slate-400">
        Sudah memiliki akun?
        <a href="{{ url_for('auth.login') }}" class="text-emerald-400 hover:text-emerald-300 font-semibold ml-1">Masuk di sini</a>
    </div>
</div>
{% endblock %}
