{% extends 'base.html' %}
{% block title %}Masuk - Driver Monitoring System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10 bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-6">
        <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-white">Masuk ke Sistem</h2>
        <p class="text-sm text-slate-400 mt-1">Masuk sebagai Driver untuk monitoring atau Admin untuk dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
            <input type="text" name="username" value="{{ username or '' }}" required autofocus
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition placeholder-slate-500"
                   placeholder="Masukkan username Anda">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
            <input type="password" name="password" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition placeholder-slate-500"
                   placeholder="••••••••">
        </div>

        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center text-slate-400 cursor-pointer">
                <input type="checkbox" name="remember" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0 mr-2">
                Ingat saya
            </label>
            <span class="text-xs text-slate-400">Akun default: <code class="text-blue-300">admin / admin123</code></span>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition duration-150">
            Masuk ke Aplikasi
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-700/60 text-center text-sm text-slate-400">
        Belum memiliki akun driver?
        <a href="{{ url_for('auth.register') }}" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">Daftar Akun Driver</a>
    </div>
</div>
{% endblock %}
